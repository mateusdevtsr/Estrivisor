services:
  # O LiveKit em si não roda mais aqui — foi migrado para o LiveKit Cloud.
  # Só o servidor de token continua rodando localmente.
  token-server:
    build: ./token-server
    container_name: estrivisor-token-server
    restart: unless-stopped
    ports:
      - "28080:8080"
    env_file:
      - ./server.env
    environment:
      DATA_FILE: /data/servidores.json
    volumes:
      # Guarda servidores, canais, membros e convites fora do container
      # (sobrevive a "docker compose up -d --build" e a reinícios).
      - ./dados:/data
