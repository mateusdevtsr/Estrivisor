# Manda o "O que há de novo" para um canal de texto do Discord quando uma versão é publicada.
# Também dá pra rodar na mão: aba Actions > "Novidades no Discord" > Run workflow
#   (versão específica, ou marcar "todas" pra mandar o histórico inteiro uma vez).
# Segredo necessário (Settings > Secrets and variables > Actions): DISCORD_WEBHOOK_URL
name: Novidades no Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 3.15.1). Vazio = a do package.json'
        type: string
        default: ''
      todas:
        description: 'Mandar o histórico inteiro (todas as versões)'
        type: boolean
        default: false

jobs:
  anunciar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mandar para o Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSAO_ESCOLHIDA: ${{ inputs.versao }}
          TODAS: ${{ inputs.todas }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$TODAS" = "true" ]; then
            node scripts/anunciar-discord.js --todas
          elif [ -n "$VERSAO_ESCOLHIDA" ]; then
            node scripts/anunciar-discord.js "$VERSAO_ESCOLHIDA"
          elif [ -n "$TAG" ]; then
            node scripts/anunciar-discord.js "${TAG#v}"
          else
            node scripts/anunciar-discord.js
          fi
