services:
  # Servidor do Estrivisor: login, servidores, chat, presença, chaves e tokens do LiveKit.
  # (A voz e o vídeo em si ficam no LiveKit da VPS.)
  token-server:
    build: ./token-server
    container_name: estrivisor-token-server
    restart: unless-stopped
    ports:
      # Só o próprio notebook acessa direto (testes). De fora, o acesso é só pelo túnel (HTTPS).
      - "127.0.0.1:28080:8080"
    env_file:
      - ./server.env
    environment:
      DATA_FILE: /data/servidores.json
      # O notebook não tem rota IPv6: o servidor tenta primeiro os endereços IPv4 (evita falhas ao falar com o Discord).
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Onde o painel (/painel) olha a data do último backup (pasta montada abaixo, só leitura).
      BACKUP_DIR: /backups
    volumes:
      # Guarda servidores, canais, mensagens, sessões e o resto fora do container
      # (sobrevive a "docker compose up -d --build" e a reinícios).
      - ./dados:/data
      # Os backups do backup.sh, só pra leitura (o painel mostra quando foi o último e se a cópia na VPS deu certo).
      - ./backups:/backups:ro
    # Os logs ficam limitados a 3 arquivos de 10 MB (sem isso crescem até encher o disco).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Túnel da Cloudflare: publica o servidor em https://api.SEU-DOMINIO sem abrir porta no
  # roteador e sem mostrar o IP da sua casa. O token fica no arquivo tunnel.env.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    container_name: estrivisor-tunel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - path: ./tunnel.env   # uma linha: TUNNEL_TOKEN=...
        required: false
    depends_on:
      - token-server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
