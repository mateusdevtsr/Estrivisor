# Monta o app Android do Estrivisor (APK) aqui no GitHub, sem precisar de Android Studio no PC.
# - Roda sozinho quando uma versão nova é publicada (npm run dist) e anexa o APK na release.
# - Também dá pra rodar na mão: aba Actions > "App Android" > Run workflow.
# Segredos (Settings > Secrets and variables > Actions):
#   TOKEN_SERVER_URL, INVITE_KEY, LIVEKIT_URL  -> os mesmos do .env do app do PC
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_SENHA, ANDROID_KEY_ALIAS -> assinatura (opcional no começo)
#   GOOGLE_SERVICES_JSON -> conteúdo do google-services.json do Firebase (notificações; opcional)
name: App Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      anexar:
        description: 'Anexar o APK na release da versão atual do package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependências do app (livekit-client)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Dependências do celular
        working-directory: celular
        run: npm install --no-audit --no-fund

      - name: Montar a tela (www)
        working-directory: celular
        env:
          TOKEN_SERVER_URL: ${{ secrets.TOKEN_SERVER_URL }}
          INVITE_KEY: ${{ secrets.INVITE_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          TEM_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' && '1' || '' }}
        run: node montar-www.js

      - name: Projeto Android
        working-directory: celular
        run: |
          npx cap add android
          npx cap sync android

      - name: Firebase (notificações, se configurado)
        working-directory: celular
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
            node -e "const j=require('./android/app/google-services.json'); const ok=(j.client||[]).some(c=>c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.estrivisor.celular'); if(!ok){console.error('O google-services.json não é do app com.estrivisor.celular. Confira o nome do pacote no Firebase.'); process.exit(1)}"
            echo "Notificações ligadas."
          else
            echo "Sem GOOGLE_SERVICES_JSON: o APK sai sem notificações."
          fi

      - name: Assinatura (se configurada)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/estrivisor.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/estrivisor.jks" >> "$GITHUB_ENV"
          else
            echo "Sem ANDROID_KEYSTORE_BASE64: vai sair a versão de teste (debug)."
          fi

      - name: Ajustes do Android (permissões, link do login, ícone, versão)
        working-directory: celular
        run: |
          command -v magick >/dev/null || command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          node ajustar-android.js

      - name: Montar o APK
        working-directory: celular/android
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_SENHA: ${{ secrets.ANDROID_KEY_SENHA }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Estrivisor-Android.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Estrivisor-Android.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Estrivisor-Android
          path: ${{ runner.temp }}/Estrivisor-Android.apk

      - name: Anexar o APK na release
        if: github.event_name == 'release' || inputs.anexar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="v$(node -p "require('./package.json').version")"; fi
          gh release upload "$TAG" "$RUNNER_TEMP/Estrivisor-Android.apk" --clobber
